allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

# Keep the pnpm pin from "packageManager" out of pnpm-lock.yaml: with it, pnpm 12
# writes the lockfile as two YAML documents, which SonarCloud's dependency
# analysis (and other YAML tooling) cannot parse.
pmOnFail: ignore
