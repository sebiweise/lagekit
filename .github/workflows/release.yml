name: Release

# Läuft nach jedem Merge auf master. Gibt es zur Version aus package.json noch
# kein Tag, entstehen Tag, GitHub-Release (Text aus CHANGELOG.md, dazu der
# statische Export als ZIP) und das Docker-Image in der GitHub Container Registry.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: Neue Version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      neu: ${{ steps.version.outputs.neu }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version gibt es schon, kein Release."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: GitHub-Release
    needs: pruefen
    if: needs.pruefen.outputs.neu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (Static Export und Service Worker)
        run: pnpm build

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && zip -qr "../lagekit-${VERSION}.zip" .)
          {
            node scripts/release.mjs notizen "$VERSION"
            echo
            echo "## Installation"
            echo
            echo "- Docker: \`docker run -p 8080:8080 ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`"
            echo "- Ohne Docker: \`lagekit-${VERSION}.zip\` auf einen beliebigen Webserver mit HTTPS entpacken."
          } > notizen.md
          gh release create "v${VERSION}" "lagekit-${VERSION}.zip" \
            --target "$GITHUB_SHA" --title "Lagekit ${VERSION}" --notes-file notizen.md

  docker:
    name: Docker-Image veröffentlichen
    needs: [pruefen, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.pruefen.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.pruefen.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Lagekit
            org.opencontainers.image.description=Offline-fähige Einsatz-Tools für Feuerwehr und Katastrophenschutz

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LAGEKIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
