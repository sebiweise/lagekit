name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build, Offline-Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version kommt aus dem Feld packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typen
        run: pnpm typecheck

      - name: Unit-Tests
        run: pnpm test

      - name: Build (Static Export und Service Worker)
        run: pnpm build

      - name: Playwright-Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Offline-Test
        run: pnpm test:e2e

      - name: Export hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lagekit-out
          path: out/
          retention-days: 7
