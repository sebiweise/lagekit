name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Der Workflow „Release vorbereiten“ startet die CI für seinen Pull Request
  # selbst, weil Pull Requests von GitHub Actions keine CI auslösen.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build, Offline-Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus dem Feld packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typen
        run: pnpm typecheck

      - name: Unit-Tests
        run: pnpm test

      - name: Build (Static Export und Service Worker)
        run: pnpm build
        env:
          # Formular an, damit der Offline-Test es prüft (der Dienst wird dort nur simuliert).
          LAGEKIT_FEEDBACK_URL: "true"

      - name: Playwright-Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Offline-Test
        run: pnpm test:e2e

      - name: Export hochladen
        uses: actions/upload-artifact@v7
        with:
          name: lagekit-out
          path: out/
          retention-days: 7

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Nur bauen, nicht veröffentlichen; das macht der Release-Workflow.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: LAGEKIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kurzcode-Dienst bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: vermittlung
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
