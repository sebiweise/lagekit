# Auslieferung des statischen Exports (out/) mit passenden Cache-Regeln.
# Vorlage: Beim Start setzt das nginx-Image Umgebungsvariablen mit LAGEKIT_ ein
# (envsubst, siehe NGINX_ENVSUBST_FILTER im Dockerfile). Variablen von nginx bleiben.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Service Worker immer frisch prüfen, sonst kommen Updates verspätet an.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Einstellungen zur Laufzeit, gelesen von src/core/sync/dienst-konfiguration.ts.
    location = /konfiguration.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"kurzcodeDienst":"${LAGEKIT_KURZCODE_DIENST}"}';
    }

    # Kurzcode-Dienst neben dem Container (compose.yaml, LAGEKIT_KURZCODE_DIENST=selbst).
    # Über eine Variable aufgelöst, damit nginx auch ohne diesen Dienst startet; 127.0.0.11
    # ist der DNS von Docker. Ohne Dienst antwortet die Adresse mit 502.
    location /api/vermittlung/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $lagekit_vermittlung http://${LAGEKIT_VERMITTLUNG};
        proxy_pass $lagekit_vermittlung;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
    }

    # Dateien mit Hash im Namen ändern sich nie.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Bis Version 0.4 lag die App unter /, seitdem unter /app/ (src/core/pwa/adressen.ts).
    location ~ ^/(einsatz|tools|arbeitsbereich|export|hinweise|sitzung|suche|aenderungen)(/|$) {
        return 301 /app$request_uri;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        # /hinweise und /hinweise/ → /hinweise/index.html (wie trailingSlash im Export).
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
