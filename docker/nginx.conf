# Auslieferung des statischen Exports (out/) mit passenden Cache-Regeln.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Service Worker immer frisch prüfen, sonst kommen Updates verspätet an.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Dateien mit Hash im Namen ändern sich nie.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        # /hinweise und /hinweise/ → /hinweise/index.html (wie trailingSlash im Export).
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
